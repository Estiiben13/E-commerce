
<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Tienda Microservicios</title>

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <header>
        <div class="header-content">
            <h1>🛒 Tienda Microservicios</h1>

            <div id="usuario-info" class="usuario-info hidden">
                <span id="usuario-email"></span>
                <button id="btn-logout" class="btn btn-danger">
                    Cerrar sesión
                </button>
            </div>
        </div>
    </header>


    <main>

        <!-- ========================= -->
        <!-- LOGIN / REGISTRO -->
        <!-- ========================= -->

        <section id="auth-section" class="auth-container">

            <div class="auth-card">

                <h2 id="auth-title">Iniciar sesión</h2>

                <p id="auth-description">
                    Ingresa para realizar compras.
                </p>

                <form id="auth-form">

                    <div class="form-group">
                        <label for="email">Correo electrónico</label>

                        <input
                            type="email"
                            id="email"
                            placeholder="usuario@gmail.com"
                            required
                        >
                    </div>


                    <div class="form-group">
                        <label for="password">Contraseña</label>

                        <input
                            type="password"
                            id="password"
                            placeholder="********"
                            required
                        >
                    </div>


                    <button type="submit" class="btn btn-primary">
                        <span id="auth-button-text">
                            Iniciar sesión
                        </span>
                    </button>

                </form>


                <p id="auth-message" class="message"></p>


                <button
                    id="btn-toggle-auth"
                    class="btn-link"
                    type="button"
                >
                    ¿No tienes cuenta? Regístrate
                </button>

            </div>

        </section>


        <!-- ========================= -->
        <!-- TIENDA -->
        <!-- ========================= -->

        <section id="store-section" class="hidden">

            <div class="welcome">
                <h2>Catálogo de productos</h2>

                <p>
                    Selecciona un producto para realizar tu compra.
                </p>
            </div>


            <div id="products-container" class="products-grid">
                <!-- Los productos se cargan desde JavaScript -->
            </div>


            <!-- ========================= -->
            <!-- PEDIDOS -->
            <!-- ========================= -->

            <section class="orders-section">

                <div class="section-header">

                    <div>
                        <h2>📦 Mis pedidos</h2>

                        <p>
                            Consulta las compras realizadas.
                        </p>
                    </div>

                    <button
                        id="btn-refresh-orders"
                        class="btn btn-secondary"
                    >
                        Actualizar
                    </button>

                </div>


                <div id="orders-container">
                    <!-- Los pedidos se cargan aquí -->
                </div>

            </section>

        </section>


        <!-- ========================= -->
        <!-- NOTIFICACIÓN -->
        <!-- ========================= -->

        <div id="notification" class="notification hidden">
        </div>

    </main>


    <footer>

        <p>
            Proyecto de Microservicios · Node.js · Express · SQLite · JWT
        </p>

    </footer>


    <script src="app.js"></script>

</body>
</html>
